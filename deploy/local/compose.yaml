# Local stack for PNH (quickstart.md). Start: docker compose -f deploy/local/compose.yaml up -d
# Host ports can be moved when they are taken, e.g. PNH_PG_PORT=15432 PNH_KAFKA_PORT=19092 PNH_REDIS_PORT=16379
# (then start the backend with PNH_DB_URL / PNH_KAFKA / PNH_REDIS pointing at those ports).
name: pnh-local
services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=200"]   # two backend instances (Q15/Q17) + CLI
    environment:
      POSTGRES_DB: pnh
      POSTGRES_USER: pnh
      POSTGRES_PASSWORD: pnh
    ports: ["${PNH_PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pnh -d pnh"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${PNH_KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["${PNH_KAFKA_PORT:-9092}:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:29092
        $$T --bootstrap-server $$B --create --if-not-exists --topic pnh.notification.ingest --partitions 12 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic pnh.notification.ingest.otp --partitions 6 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic pnh.notification.result --partitions 12 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic pnh.notification.ingest.DLT --partitions 3 --replication-factor 1
        echo "topics ready"

  redis:
    image: redis:7
    ports: ["${PNH_REDIS_PORT:-6379}:6379"]

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_MAX_MESSAGES: 20000   # default keeps only 500: quickstart Q8/Q9 count every delivered email
    ports: ["${PNH_SMTP_PORT:-1025}:1025", "${PNH_MAILPIT_UI_PORT:-8025}:8025"]

  wiremock:
    image: wiremock/wiremock:3.13.2
    command: ["--global-response-templating", "--verbose"]
    ports: ["${PNH_WIREMOCK_PORT:-8089}:8080"]
    volumes:
      - ./wiremock:/home/wiremock
