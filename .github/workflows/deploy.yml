name: deploy

# Auto: after the `ci` workflow passes on main → build images → deploy to the VPS.
# Manual: Actions → deploy → Run workflow (leave `tag` empty to build+deploy the selected
#         branch, or set `tag` to an existing image tag / git SHA to roll back without building).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing image tag (git SHA) to redeploy — empty = build current commit
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      tag: ${{ steps.vars.outputs.tag }}
      image: ${{ steps.vars.outputs.image }}
      build: ${{ steps.vars.outputs.build }}
    steps:
      - id: vars
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          sha="${RUN_SHA:-$GITHUB_SHA}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ -n "$INPUT_TAG" ]]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$sha" >> "$GITHUB_OUTPUT";       echo "build=true"  >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: backend/Dockerfile
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.prepare.outputs.sha }}' }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.image }}/${{ matrix.component }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.image }}/${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: [prepare, build]
    # run when build succeeded, or was skipped because a tag was given (rollback)
    if: always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/pnh' }}
      SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: deploy/prod

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [[ -n "$KNOWN_HOSTS" ]]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS not set — trusting host key from ssh-keyscan"
            ssh-keyscan -p "$SSH_PORT" "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  HostKeyAlias %s\n  ServerAliveInterval 30\n' \
            "$VPS_HOST" "$VPS_USER" "$SSH_PORT" "$VPS_HOST" > ~/.ssh/config

      - name: Upload compose files
        run: |
          ssh vps "mkdir -p '$DEPLOY_DIR'"
          scp deploy/prod/compose.yaml deploy/prod/deploy.sh deploy/prod/env.example deploy/prod/app.env.example \
            "vps:$DEPLOY_DIR/"

      - name: Pull & restart on VPS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          ssh vps bash -s -- "$DEPLOY_DIR" "$TAG" "$GITHUB_ACTOR" <<EOF
          set -euo pipefail
          cd "\$1"
          echo '$GHCR_TOKEN' | docker login ghcr.io -u "\$3" --password-stdin >/dev/null
          trap 'docker logout ghcr.io >/dev/null' EXIT
          chmod +x deploy.sh
          ./deploy.sh "\$2"
          EOF

      - name: Summary
        if: always()
        run: |
          echo "### Deploy \`${{ needs.prepare.outputs.tag }}\` → ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
