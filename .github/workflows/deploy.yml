name: deploy

# Auto: after the `ci` workflow passes on main → build images → deploy to the VPS.
# Manual: Actions → deploy → Run workflow (leave `tag` empty to build+deploy the selected
#         branch, or set `tag` to an existing image tag / git SHA to roll back without building).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing image tag (git SHA) to redeploy — empty = build current commit
        required: false
        default: ''

concurrency:
  group: deploy-vinspeed-uat
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      tag: ${{ steps.vars.outputs.tag }}
      image: ${{ steps.vars.outputs.image }}
      build: ${{ steps.vars.outputs.build }}
    steps:
      - id: vars
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          sha="${RUN_SHA:-$GITHUB_SHA}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ -n "$INPUT_TAG" ]]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$sha" >> "$GITHUB_OUTPUT";       echo "build=true"  >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: backend/Dockerfile
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.prepare.outputs.sha }}' }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.image }}/${{ matrix.component }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.image }}/${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: [prepare, build]
    # run when build succeeded, or was skipped because a tag was given (rollback)
    if: always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: vinspeed-uat
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || secrets.DEPLOY_DIR || '/opt/pnh' }}
      SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: deploy/prod

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          # Fail early with a clear message if the secret is not a usable, passphrase-less private key
          if ! pub=$(ssh-keygen -y -P '' -f ~/.ssh/id_deploy 2>&1); then
            first=$(head -1 ~/.ssh/id_deploy | cut -c1-40)
            echo "::error::VPS_SSH_KEY is not a valid private key without passphrase ($(wc -l < ~/.ssh/id_deploy) line(s), starts with '${first}'). Expected the full file incl. '-----BEGIN OPENSSH PRIVATE KEY-----' / '-----END ...-----' on separate lines. ssh-keygen: ${pub}"
            exit 1
          fi
          echo "Deploy key (must be in ~/.ssh/authorized_keys of VPS_USER on the VPS):"
          printf '%s\n' "$pub" | ssh-keygen -lf -
          if [[ -n "$KNOWN_HOSTS" ]]; then
            # Keep only the key type + key of each entry and pin them to VPS_HOST, so the secret works
            # whatever host form ssh-keyscan printed (IP vs domain, [host]:port, hashed |1|...).
            # Accepts known_hosts lines ("host type key"), .pub lines ("type key comment") or bare "type key".
            printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' | awk -v h="$VPS_HOST" '
              /^[[:space:]]*#/ { next }
              { for (i = 1; i < NF; i++) if ($i ~ /^(ssh-(ed25519|rsa|dss)|ecdsa-sha2-nistp(256|384|521)|sk-(ssh-ed25519|ecdsa-sha2-nistp256)@openssh\.com)$/) { print h, $i, $(i+1); next } }
            ' > ~/.ssh/known_hosts
            if [[ ! -s ~/.ssh/known_hosts ]]; then
              lines=$(printf '%s\n' "$KNOWN_HOSTS" | grep -c . || true)
              comments=$(printf '%s\n' "$KNOWN_HOSTS" | grep -c '^[[:space:]]*#' || true)
              echo "::error::VPS_KNOWN_HOSTS has no host key (ssh-ed25519/ecdsa-*/ssh-rsa) — $lines non-empty line(s), $comments comment line(s). Put the output of 'ssh-keyscan $VPS_HOST' (key lines, not only '#' lines) in the secret."
              exit 1
            fi
            echo "Trusted host keys (from VPS_KNOWN_HOSTS):"; ssh-keygen -lf ~/.ssh/known_hosts
            echo "Keys the server presents now (compare SHA256 values):"
            ssh-keyscan -p "$SSH_PORT" "$VPS_HOST" 2>/dev/null | ssh-keygen -lf - || echo "  (ssh-keyscan could not reach $VPS_HOST:$SSH_PORT)"
          else
            echo "::warning::VPS_KNOWN_HOSTS not set — trusting host key from ssh-keyscan"
            ssh-keyscan -p "$SSH_PORT" "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  HostKeyAlias %s\n  ServerAliveInterval 30\n' \
            "$VPS_HOST" "$VPS_USER" "$SSH_PORT" "$VPS_HOST" > ~/.ssh/config

      # Only the files needed to run. .env / app.env live on the VPS only and are never touched here.
      - name: Upload compose files
        run: |
          ssh vps "mkdir -p '$DEPLOY_DIR'"
          scp deploy/prod/compose.yaml deploy/prod/deploy.sh "vps:$DEPLOY_DIR/"

      - name: Pull & restart on VPS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          ssh vps bash -s -- "$DEPLOY_DIR" "$TAG" "$GITHUB_ACTOR" <<EOF
          set -euo pipefail
          cd "\$1"
          echo '$GHCR_TOKEN' | docker login ghcr.io -u "\$3" --password-stdin >/dev/null
          trap 'docker logout ghcr.io >/dev/null' EXIT
          chmod +x deploy.sh
          ./deploy.sh "\$2"
          EOF

      - name: Summary
        if: always()
        run: |
          echo "### Deploy \`${{ needs.prepare.outputs.tag }}\` → ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
