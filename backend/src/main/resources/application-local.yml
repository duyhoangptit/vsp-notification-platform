spring:
  flyway:
    locations: classpath:db/migration,classpath:db/local

pnh:
  crypto:
    # dev-only key (32 bytes, base64) — never use outside local
    master-key: ${PNH_MASTER_KEY:cG5oLWxvY2FsLWRldi1tYXN0ZXIta2V5LTMyYnl0ZXM=}
  clock:
    override-enabled: true
  kafka:
    signature-required: false

springdoc:
  api-docs:
    enabled: ${PNH_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${PNH_API_DOCS_ENABLED:true}
