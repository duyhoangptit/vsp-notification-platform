# Serves the SPA and proxies API traffic to the backend container, so the console
# and its API share one origin (session cookie + XSRF-TOKEN work without CORS).
# Resolve `pnh-backend` (alias on the private pnh-internal network) through Docker DNS at request time, so a recreated backend
# container (new IP) is picked up without restarting this one.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 10m;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pnh_backend http://pnh-backend:8080;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Console API (operator UI) and client API / provider callbacks
    location ~ ^/(console/api|api)/ {
        proxy_pass $pnh_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The host Nginx (TLS terminator) already set these; pass them through unchanged.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Hashed build assets: cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing; index.html must never be cached so new deploys are picked up
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
